<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wok Express logo exploration</title>
<style>
  @font-face { font-family: "Archivo"; src: url("../../site/assets/fonts/archivo-latin.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: "Noto Serif TC"; src: url("../../site/assets/fonts/noto-serif-tc-900-subset.woff2") format("woff2"); font-weight: 900; }
  :root { --paper: #F3F2EE; --ink: #17191B; --seal: #C43A25; }
  body { margin: 0; background: #1A1C1E; font-family: "Archivo", sans-serif; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; }
  .cell { background: var(--paper); height: 380px; display: grid; place-items: center; position: relative; }
  .cell.dark { background: #111213; }
  .cell small { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #6b6e72; letter-spacing: .04em; }
  svg.mark { width: 160px; height: 160px; }
  .lockup { display: flex; align-items: center; gap: 18px; }
  .lockup svg { width: 64px; height: 64px; }
  .word { font-size: 44px; font-weight: 620; font-stretch: 112%; letter-spacing: -0.035em; color: var(--ink); }
  .dark .word { color: #ECEBE6; }
</style>
</head>
<body>
<div class="grid">
  <!-- A: half-disc wok + handle + single steam stroke breaking top edge -->
  <div class="cell">
    <svg class="mark" viewBox="0 0 100 100" aria-label="A">
      <rect width="100" height="100" fill="#C43A25"/>
      <path d="M20 54 A30 30 0 0 0 80 54 Z" fill="#F3F2EE"/>
      <rect x="78" y="51" width="13" height="6" fill="#F3F2EE"/>
      <path d="M50 46 C 41 38, 59 30, 50 21 S 50 6, 50 -2" fill="none" stroke="#F3F2EE" stroke-width="6.5" stroke-linecap="butt"/>
    </svg>
    <small>A · wok, handle, one steam line</small>
  </div>
  <!-- B: circle wok seen from above, split by rim -->
  <div class="cell">
    <svg class="mark" viewBox="0 0 100 100" aria-label="B">
      <rect width="100" height="100" fill="#C43A25"/>
      <path d="M18 50 A32 32 0 0 0 82 50 Z" fill="#F3F2EE"/>
      <path d="M36 42 C 30 34, 42 28, 36 18" fill="none" stroke="#F3F2EE" stroke-width="5"/>
      <path d="M50 42 C 44 34, 56 28, 50 18" fill="none" stroke="#F3F2EE" stroke-width="5"/>
      <path d="M64 42 C 58 34, 70 28, 64 18" fill="none" stroke="#F3F2EE" stroke-width="5"/>
    </svg>
    <small>B · bowl + three steam lines</small>
  </div>
  <!-- C: character seal -->
  <div class="cell">
    <svg class="mark" viewBox="0 0 100 100" aria-label="C">
      <rect width="100" height="100" fill="#C43A25"/>
      <rect x="5" y="5" width="90" height="90" fill="none" stroke="#F3F2EE" stroke-width="2.5"/>
      <text x="50" y="47" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="38" fill="#F3F2EE">鑊</text>
      <text x="50" y="87" text-anchor="middle" font-family="Noto Serif TC" font-weight="900" font-size="38" fill="#F3F2EE">氣</text>
    </svg>
    <small>C · 鑊氣 character seal (secondary)</small>
  </div>
  <!-- D: wok tilted (toss), steam leaving frame -->
  <div class="cell">
    <svg class="mark" viewBox="0 0 100 100" aria-label="D">
      <rect width="100" height="100" fill="#C43A25"/>
      <g transform="rotate(-12 50 60)">
        <path d="M18 58 A32 32 0 0 0 82 58 Z" fill="#F3F2EE"/>
        <rect x="80" y="55" width="14" height="6" fill="#F3F2EE"/>
      </g>
      <path d="M46 44 C 38 36, 56 30, 48 20 S 47 6, 48 -2" fill="none" stroke="#F3F2EE" stroke-width="6.5"/>
    </svg>
    <small>D · tossing wok, steam exits frame</small>
  </div>
  <div class="cell">
    <div class="lockup">
      <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#C43A25"/><path d="M20 54 A30 30 0 0 0 80 54 Z" fill="#F3F2EE"/><rect x="78" y="51" width="13" height="6" fill="#F3F2EE"/><path d="M50 46 C 41 38, 59 30, 50 21 S 50 6, 50 -2" fill="none" stroke="#F3F2EE" stroke-width="6.5"/></svg>
      <span class="word">Wok Express</span>
    </div>
    <small>A lockup on paper</small>
  </div>
  <div class="cell dark">
    <div class="lockup">
      <svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#E0563E"/><path d="M20 54 A30 30 0 0 0 80 54 Z" fill="#111213"/><rect x="78" y="51" width="13" height="6" fill="#111213"/><path d="M50 46 C 41 38, 59 30, 50 21 S 50 6, 50 -2" fill="none" stroke="#111213" stroke-width="6.5"/></svg>
      <span class="word">Wok Express</span>
    </div>
    <small>A lockup on iron</small>
  </div>
</div>
</body>
</html>
